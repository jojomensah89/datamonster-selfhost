    <link rel="canonical" href="https://datamonster.dev/" />
    <meta name="theme-color" content="#efede8" />
    <script>
      // Theme before first paint (lib/theme.ts keeps it in step afterwards): the stored choice, else the system's.
      // The marketing landing page at "/" (signed out) is always light, so "/" turns dark only for a signed-in app.
      (function () {
        var d = document.documentElement, t = 'light';
        try {
          var p = localStorage.getItem('dm_theme');
          var landing = location.pathname === '/' && !localStorage.getItem('dm_app');
          var directories = /^\/directories(\/|$)/.test(location.pathname);
          if (!landing && !directories) t = p === 'dark' || p === 'light' ? p : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        d.setAttribute('data-theme', t);
        d.style.colorScheme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131312');
      })();
    </script>

    <script>
      // datamonster.dev tracks itself with DataMonster. Only on that domain, so self-hosted dashboards load nothing extra.
      if (/(^|\.)datamonster\.dev$/.test(location.hostname)) {
        // Queue calls (identify, goal) made before the script has loaded; the tracker replays them.
        window.datamonster = window.datamonster || function () { (window.datamonster.q = window.datamonster.q || []).push(arguments); };
        var s = document.createElement('script');
        s.defer = true;
        s.setAttribute('data-website-id', '2r2m2d29014o6243');
        s.src = 'https://datamonster.dev/js/script.js';
        document.head.appendChild(s);
      }
    </script>
