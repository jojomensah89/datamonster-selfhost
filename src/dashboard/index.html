<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataMonster: know which post brought you customers</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="description" content="Website analytics for any business. See which post, ad, launch or link brought you customers, and what they spent." />
    <link rel="canonical" href="https://datamonster.dev/" />
    <meta name="theme-color" content="#efede8" />
    <script>
      // Theme before first paint (lib/theme.ts keeps it in step afterwards): the stored choice, else the system's.
      // The marketing landing page at "/" (signed out) is always light, so "/" turns dark only for a signed-in app.
      (function () {
        var d = document.documentElement, t = 'light', landing, directories;
        try {
          var p = localStorage.getItem('dm_theme');
          landing = location.pathname === '/' && !localStorage.getItem('dm_app');
          directories = /^\/directories(\/|$)/.test(location.pathname);
          if (!landing && !directories) t = p === 'dark' || p === 'light' ? p : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        d.setAttribute('data-theme', t);
        // With scripts on, people see the logo while the app loads. If the app's script fails, the plain text comes back.
        d.classList.add('js');
        if (landing || directories) d.classList.add('splash-white');
        addEventListener('error', function (e) {
          if (e.target && e.target.type === 'module') d.classList.remove('js');
        }, true);
        d.style.colorScheme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131312');
      })();
    </script>
    <style>
      #splash { display: none; }
      .js #root > #plain { display: none; }
      .js #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #efede8; color: #1f54f0; }
      .js.splash-white #splash { background: #fff; }
      .js[data-theme='dark'] #splash { background: #131312; color: #5580ff; }
      /* A quick load never flashes the logo. */
      #splash svg { animation: splash-in 200ms ease-out 150ms both; }
      @keyframes splash-in { from { opacity: 0; } }
    </style>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="DataMonster" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://datamonster.dev/" />
    <meta property="og:title" content="DataMonster: know which post brought you customers" />

    <meta name="twitter:image:alt" content="DataMonster: know which post brought you customers, in white on blue, with the DataMonster mascot" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DataMonster",
        "url": "https://datamonster.dev/",
        "description": "Website analytics for any business. See which post, ad, launch or link brought you customers, and what they spent.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "image": "https://datamonster.dev/og-image.png"
      }
    </script>
    <script>
      // datamonster.dev tracks itself with DataMonster. Only on that domain, so self-hosted dashboards load nothing extra.
      if (/(^|\.)datamonster\.dev$/.test(location.hostname)) {
        // Queue calls (identify, goal) made before the script has loaded; the tracker replays them.
        window.datamonster = window.datamonster || function () { (window.datamonster.q = window.datamonster.q || []).push(arguments); };
        var s = document.createElement('script');
        s.defer = true;
        s.setAttribute('data-website-id', '2r2m2d29014o6243');
        s.src = 'https://datamonster.dev/js/script.js';
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <!-- For crawlers and browsers without scripts; React replaces it on first render. Same words as the landing page's hero. -->
    <div id="root">
      <main id="plain" style="max-width: 42rem; margin: 4rem auto; padding: 0 1rem; text-align: center; font-family: system-ui, sans-serif">
        <h1>Know which post brought you customers</h1>
        <p>Website analytics for any business. See what brings in sales: a post, an ad, Google or a launch.</p>
      </main>
    </div>
    <!-- App.tsx removes it once it knows which page to show. -->

      </svg>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
