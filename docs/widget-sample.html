<!doctype html>
<meta charset="utf-8">
<title>DataMonster widget illustrative preview</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}body.dark{background:#080f20}</style>
<body>
<!-- Illustrative preview: the browser capture mocks aggregates; no production data. -->
<datamonster-online site="widget"></datamonster-online>
<script>
const params = new URLSearchParams(location.search);
document.body.classList.toggle('dark', params.get('host') === 'dark');
const widget = document.querySelector('datamonster-online');
for (const key of ['theme', 'powered', 'size']) widget.setAttribute(key, params.get(key) || ({theme:'light', powered:'true', size:'medium'})[key]);
</script>
<script src="/js/widget.js"></script>
</body>
